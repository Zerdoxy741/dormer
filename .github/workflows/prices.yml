# Every day: read the current prices (Polar for Dormer Pro, NotchNook's page, DynamicLake's Gumroad page),
# rebuild the site, and publish only if something changed. Cloudflare Pages redeploys on the push.
# Optional secret POLAR_TOKEN: a Polar organization access token with the products:read scope.
name: Sync prices
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-prices
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read prices
        run: python3 scripts/sync_prices.py
        env:
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
      - name: Rebuild pages
        run: python3 scripts/build.py
      - name: Publish if something changed
        run: |
          if git diff --quiet -- docs data; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Update prices"
          git push
