<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141936"/>
      <stop offset="1" stop-color="#1b2147"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3770"/>
      <stop offset="1" stop-color="#1e2450"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".95" r=".8">
      <stop offset="0" stop-color="#ffcf70" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#ffb347" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <!-- the site's scalloped roof tiles, scaled up -->
    <pattern id="tiles" width="28" height="18" patternUnits="userSpaceOnUse" patternTransform="translate(0 4) scale(2.4)">
      <rect width="28" height="18" fill="#6b4a5a"/>
      <path d="M0 9 Q7 1 14 9 Q21 1 28 9" fill="none" stroke="#80596b" stroke-width="2"/>
      <path d="M-14 18 Q-7 10 0 18 Q7 10 14 18 Q21 10 28 18 Q35 10 42 18" fill="none" stroke="#4f3546" stroke-width="2"/>
    </pattern>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <g fill="#f3ead8">
      <rect x="236" y="200" width="14" height="14"/>
      <rect x="772" y="176" width="12" height="12" opacity=".7"/>
      <rect x="830" y="300" width="10" height="10" opacity=".5"/>
      <rect x="180" y="330" width="10" height="10" opacity=".45"/>
    </g>

    <g transform="translate(512 548) scale(1.2) translate(-512 -446)">
    <!-- the Mac screen under the roof -->
    <rect x="-40" y="520" width="1104" height="460" fill="url(#screen)"/>
    <!-- menu bar -->
    <rect x="-40" y="528" width="1104" height="44" fill="#f3ead8" opacity=".1"/>
    <g fill="#b3b8da" opacity=".75">
      <rect x="196" y="543" width="22" height="14" rx="4"/>
      <rect x="234" y="543" width="54" height="14" rx="4"/>
      <rect x="302" y="543" width="40" height="14" rx="4"/>
      <rect x="690" y="543" width="40" height="14" rx="4"/>
      <rect x="746" y="543" width="22" height="14" rx="4"/>
      <rect x="784" y="543" width="44" height="14" rx="4"/>
    </g>

    <!-- main roof -->
    <path d="M196 384 H828 L960 528 H64 Z" fill="url(#tiles)"/>
    <path d="M196 384 H828" stroke="#80596b" stroke-width="7"/>
    <rect x="64" y="516" width="896" height="16" fill="#3e2938"/>

    <!-- dormer: frame, then one black opening that runs down into the notch -->
    <rect x="354" y="388" width="316" height="144" fill="#4f3546"/>
    <path d="M384 394 H640 V610 A52 52 0 0 1 588 662 H436 A52 52 0 0 1 384 610 Z" fill="#000"/>
    <rect x="384" y="394" width="256" height="138" fill="url(#lamp)"/>
    <!-- gable -->
    <path d="M326 398 L512 236 L698 398 Z" fill="url(#tiles)"/>
    <path d="M318 402 L512 230 L706 402" fill="none" stroke="#3e2938" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="512" cy="330" r="24" fill="#3e2938"/>
    <circle cx="512" cy="330" r="13" fill="#ffcf70"/>

    <!-- pixel cat sitting in the notch -->
    <g fill="#ffcf70">
      <rect x="476" y="556" width="12" height="12"/>
      <rect x="536" y="556" width="12" height="12"/>
      <path d="M476 568 h72 v36 h-72 Z M488 580 v12 h12 v-12 Z M524 580 v12 h12 v-12 Z" fill-rule="evenodd"/>
      <rect x="464" y="604" width="96" height="44"/>
      <rect x="560" y="624" width="24" height="12"/>
      <rect x="572" y="600" width="12" height="24"/>
    </g>
    </g>
  </g>
</svg>
